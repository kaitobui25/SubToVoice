<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>SubToVoice Debug</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; margin: 0; padding: 14px; }
    h3 { margin: 0 0 8px; }
    p { margin: 6px 0 12px; font-size: 13px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; padding: 8px; cursor: pointer; }
    #mark { width: 100%; margin-top: 10px; font-weight: 600; }
    #logInfo { font-size: 12px; color: #666; margin-top: 10px; }
  </style>
</head>
<body>
  <h3>SubToVoice · Debug</h3>
  <p id="status">Đang kết nối...</p>
  <button id="mark">⚑ Đánh dấu BUG vừa xảy ra</button>
  <div class="row">
    <button id="export">Export log</button>
    <button id="clear">Clear log</button>
  </div>
  <div id="logInfo">Đang đọc log...</div>
  <script src="popup-debug.js"></script>
</body>
</html>
