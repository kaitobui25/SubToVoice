<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>SubToVoice</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 290px; margin: 0; padding: 14px; }
    h3 { margin: 0 0 6px; }
    p { margin: 6px 0 12px; font-size: 13px; }
    label { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .buttons { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 8px 10px; cursor: pointer; }
    #logState { color: #666; font-size: 12px; margin-bottom: 0; }
  </style>
</head>
<body>
  <h3>SubToVoice</h3>
  <p>Đọc CC đang hiển thị trên YouTube</p>
  <label><input id="debugLogging" type="checkbox"> Thu log debug</label>
  <div class="buttons">
    <button id="downloadLog" type="button">Tải log.json</button>
    <button id="clearLog" type="button">Xóa log</button>
  </div>
  <p id="logState">Đang đọc cài đặt...</p>
  <script src="popup-log.js"></script>
</body>
</html>
